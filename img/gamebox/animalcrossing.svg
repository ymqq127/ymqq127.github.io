<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 350">
  <defs>
    <linearGradient id="abg" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#5ed8a0"/>
      <stop offset="50%" stop-color="#4abe8a"/>
      <stop offset="100%" stop-color="#2d8a5e"/>
    </linearGradient>
    <radialGradient id="aglow" cx="0.5" cy="0.3" r="0.5">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="250" height="350" rx="10" fill="url(#abg)"/>
  <rect width="250" height="350" rx="10" fill="url(#aglow)"/>
  <!-- 树叶装饰 -->
  <ellipse cx="125" cy="75" rx="22" ry="12" fill="none" stroke="#fff" stroke-width="1" opacity="0.2" transform="rotate(-20,125,75)"/>
  <ellipse cx="115" cy="82" rx="15" ry="8" fill="none" stroke="#e0ffe8" stroke-width="0.7" opacity="0.15" transform="rotate(15,115,82)"/>
  <circle cx="145" cy="68" r="2" fill="#fff" opacity="0.3"/>
  <circle cx="95" cy="80" r="1.5" fill="#e0ffe8" opacity="0.25"/>
  <!-- 标题 -->
  <text x="125" y="148" font-family="serif" font-size="24" fill="#fff" text-anchor="middle" font-weight="bold" letter-spacing="3">集合啦！</text>
  <text x="125" y="183" font-family="serif" font-size="22" fill="#e0ffe8" text-anchor="middle" letter-spacing="4">动物森友会</text>
  <!-- 分隔线 -->
  <line x1="55" y1="210" x2="195" y2="210" stroke="#fff" stroke-width="0.5" opacity="0.3"/>
  <!-- 副文 -->
  <text x="125" y="240" font-size="11" fill="#fff" text-anchor="middle" opacity="0.5" letter-spacing="2">ANIMAL CROSSING</text>
  <text x="125" y="260" font-size="10" fill="#e0ffe8" text-anchor="middle" opacity="0.4" letter-spacing="1">NEW HORIZONS</text>
  <!-- 底部装饰 -->
  <circle cx="125" cy="310" r="3" fill="#fff" opacity="0.3"/>
  <circle cx="110" cy="310" r="1.5" fill="#e0ffe8" opacity="0.2"/>
  <circle cx="140" cy="310" r="1.5" fill="#e0ffe8" opacity="0.2"/>
  <!-- 边框 -->
  <rect x="8" y="8" width="234" height="334" rx="7" fill="none" stroke="#fff" stroke-width="0.8" opacity="0.2"/>
</svg>