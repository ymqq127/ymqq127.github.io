<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 350">
  <defs>
    <linearGradient id="sbg" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#2a2a5e"/>
      <stop offset="50%" stop-color="#1a1a3e"/>
      <stop offset="100%" stop-color="#0d0d2a"/>
    </linearGradient>
    <radialGradient id="sglow" cx="0.5" cy="0.3" r="0.5">
      <stop offset="0%" stop-color="#8ea8f0" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#8ea8f0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="250" height="350" rx="10" fill="url(#sbg)"/>
  <rect width="250" height="350" rx="10" fill="url(#sglow)"/>
  <!-- 星轨装饰 -->
  <ellipse cx="125" cy="80" rx="50" ry="20" fill="none" stroke="#8ea8f0" stroke-width="0.8" opacity="0.2" transform="rotate(-15,125,80)"/>
  <ellipse cx="125" cy="80" rx="35" ry="14" fill="none" stroke="#b0c4f8" stroke-width="0.5" opacity="0.15" transform="rotate(-15,125,80)"/>
  <circle cx="160" cy="72" r="2" fill="#b0c4f8" opacity="0.4"/>
  <circle cx="90" cy="88" r="1.5" fill="#8ea8f0" opacity="0.3"/>
  <!-- 标题 -->
  <text x="125" y="150" font-family="serif" font-size="24" fill="#8ea8f0" text-anchor="middle" font-weight="bold" letter-spacing="4">崩坏</text>
  <text x="125" y="185" font-family="serif" font-size="22" fill="#b0c4f8" text-anchor="middle" letter-spacing="5">星穹铁道</text>
  <!-- 分隔线 -->
  <line x1="55" y1="210" x2="195" y2="210" stroke="#8ea8f0" stroke-width="0.5" opacity="0.3"/>
  <!-- 副文 -->
  <text x="125" y="240" font-size="11" fill="#8ea8f0" text-anchor="middle" opacity="0.5" letter-spacing="2">HONKAI</text>
  <text x="125" y="260" font-size="10" fill="#8ea8f0" text-anchor="middle" opacity="0.4" letter-spacing="1">STAR RAIL</text>
  <!-- 底部星点 -->
  <circle cx="125" cy="310" r="2.5" fill="#8ea8f0" opacity="0.35"/>
  <circle cx="108" cy="312" r="1.2" fill="#b0c4f8" opacity="0.2"/>
  <circle cx="142" cy="308" r="1.2" fill="#b0c4f8" opacity="0.2"/>
  <!-- 边框 -->
  <rect x="8" y="8" width="234" height="334" rx="7" fill="none" stroke="#8ea8f0" stroke-width="0.8" opacity="0.2"/>
</svg>