<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 350">
  <defs>
    <linearGradient id="hbg" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#2a2a48"/>
      <stop offset="50%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0a0a18"/>
    </linearGradient>
    <radialGradient id="hglow" cx="0.5" cy="0.35" r="0.45">
      <stop offset="0%" stop-color="#c8c8e0" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#c8c8e0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="250" height="350" rx="10" fill="url(#hbg)"/>
  <rect width="250" height="350" rx="10" fill="url(#hglow)"/>
  <!-- 骑士面具轮廓 -->
  <ellipse cx="125" cy="78" rx="28" ry="32" fill="none" stroke="#c8c8e0" stroke-width="1.2" opacity="0.2"/>
  <ellipse cx="115" cy="72" rx="6" ry="9" fill="none" stroke="#c8c8e0" stroke-width="0.8" opacity="0.25"/>
  <ellipse cx="135" cy="72" rx="6" ry="9" fill="none" stroke="#c8c8e0" stroke-width="0.8" opacity="0.25"/>
  <line x1="125" y1="85" x2="125" y2="100" stroke="#c8c8e0" stroke-width="0.8" opacity="0.15"/>
  <!-- 标题 -->
  <text x="125" y="155" font-family="serif" font-size="26" fill="#c8c8e0" text-anchor="middle" font-weight="bold" letter-spacing="4">空洞骑士</text>
  <text x="125" y="185" font-family="sans-serif" font-size="14" fill="#9090b0" text-anchor="middle" letter-spacing="3">Hollow Knight</text>
  <!-- 分隔线 -->
  <line x1="60" y1="210" x2="190" y2="210" stroke="#c8c8e0" stroke-width="0.5" opacity="0.25"/>
  <!-- 副文 -->
  <text x="125" y="240" font-size="10" fill="#c8c8e0" text-anchor="middle" opacity="0.4" letter-spacing="2">METROIDVANIA</text>
  <text x="125" y="260" font-size="10" fill="#9090b0" text-anchor="middle" opacity="0.35" letter-spacing="1">TEAM CHERRY</text>
  <!-- 底部灵魂之光 -->
  <circle cx="125" cy="310" r="4" fill="#c8c8e0" opacity="0.15"/>
  <circle cx="125" cy="310" r="2" fill="#e0e0f0" opacity="0.3"/>
  <!-- 边框 -->
  <rect x="8" y="8" width="234" height="334" rx="7" fill="none" stroke="#c8c8e0" stroke-width="0.8" opacity="0.15"/>
</svg>