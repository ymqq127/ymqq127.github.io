<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 350">
  <defs>
    <linearGradient id="zbg" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#2d7a4a"/>
      <stop offset="50%" stop-color="#1a5c2a"/>
      <stop offset="100%" stop-color="#0d3318"/>
    </linearGradient>
    <radialGradient id="zglow" cx="0.5" cy="0.35" r="0.5">
      <stop offset="0%" stop-color="#7ec882" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#7ec882" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="250" height="350" rx="10" fill="url(#zbg)"/>
  <rect width="250" height="350" rx="10" fill="url(#zglow)"/>
  <!-- 装饰三角 -->
  <polygon points="125,60 155,110 95,110" fill="none" stroke="#7ec882" stroke-width="1.5" opacity="0.25"/>
  <polygon points="125,70 148,108 102,108" fill="none" stroke="#a8e6ac" stroke-width="1" opacity="0.15"/>
  <!-- 标题 -->
  <text x="125" y="155" font-family="serif" font-size="26" fill="#7ec882" text-anchor="middle" font-weight="bold" letter-spacing="3">塞尔达传说</text>
  <text x="125" y="190" font-family="serif" font-size="20" fill="#a8e6ac" text-anchor="middle" letter-spacing="5">王国之泪</text>
  <!-- 分隔线 -->
  <line x1="60" y1="215" x2="190" y2="215" stroke="#7ec882" stroke-width="0.5" opacity="0.3"/>
  <!-- 副文 -->
  <text x="125" y="245" font-size="11" fill="#7ec882" text-anchor="middle" opacity="0.5" letter-spacing="2">THE LEGEND OF ZELDA</text>
  <text x="125" y="265" font-size="10" fill="#7ec882" text-anchor="middle" opacity="0.4" letter-spacing="1">TEARS OF THE KINGDOM</text>
  <!-- 底部装饰 -->
  <circle cx="125" cy="310" r="3" fill="#7ec882" opacity="0.3"/>
  <circle cx="110" cy="310" r="1.5" fill="#7ec882" opacity="0.2"/>
  <circle cx="140" cy="310" r="1.5" fill="#7ec882" opacity="0.2"/>
  <!-- 边框 -->
  <rect x="8" y="8" width="234" height="334" rx="7" fill="none" stroke="#7ec882" stroke-width="0.8" opacity="0.2"/>
</svg>